services:
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanshi
      POSTGRES_USER: kanshi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - kanshi_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kanshi]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    image: ghcr.io/kanshi-dev/core:${CORE_VERSION:-1.2.1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: kanshi
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: kanshi
      KANSHI_API_KEY: ${KANSHI_API_KEY}
      KANSHI_DASHBOARD_KEY: ${KANSHI_DASHBOARD_KEY}
      KANSHI_ALLOWED_ORIGINS: ${KANSHI_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      KANSHI_ALERT_INTERVAL: 10s
      KANSHI_WEBHOOK_URLS: http://demo-driver:9000
      KANSHI_WEBHOOK_SECRET: ${KANSHI_WEBHOOK_SECRET}
      KANSHI_TRACE_RETENTION: ${KANSHI_TRACE_RETENTION:-168h}
      KANSHI_LOG_RETENTION: ${KANSHI_LOG_RETENTION:-72h}
    ports:
      - "8080:8080"
      - "50051:50051"

  collector:
    image: otel/opentelemetry-collector:0.157.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      core:
        condition: service_healthy
    environment:
      KANSHI_API_KEY: ${KANSHI_API_KEY}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

  checkout:
    image: ghcr.io/kanshi-dev/demo-checkout:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      collector:
        condition: service_started
      payments:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      OTEL_RESOURCE_ATTRIBUTES: host.name=kanshi-server
      PAYMENTS_URL: http://payments:8082/charge

  payments:
    image: ghcr.io/kanshi-dev/demo-payments:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - collector
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      OTEL_RESOURCE_ATTRIBUTES: host.name=kanshi-server
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(8082,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

  demo-driver:
    image: ghcr.io/kanshi-dev/demo-driver:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
      checkout:
        condition: service_started
    environment:
      KANSHI_DASHBOARD_KEY: ${KANSHI_DASHBOARD_KEY}
      DEMO_INTERVAL_SECONDS: ${DEMO_INTERVAL_SECONDS:-30}

  dashboard:
    image: ghcr.io/kanshi-dev/dashboard:${DASHBOARD_VERSION:-1.2.1}
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:80"

volumes:
  kanshi_db:
